<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="380" viewBox="0 0 1200 380"
     role="img" aria-labelledby="title desc">
  <title id="title">dsh-purge 存档 — 上游 YuJunZhiXue/dsh-purge v1.1.71 的归档副本，非自研</title>
  <desc id="desc">左侧是存档说明：这是上游 YuJunZhiXue/dsh-purge 的归档副本，不是自研项目；右侧是一个档案盒图案，盖着 ARCHIVE 存档章，标注版本 1.1.71 与默认分支 master。</desc>

  <rect width="1200" height="380" rx="26" fill="#1F2937"/>

  <!-- Title block -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <text x="56" y="72" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="18" letter-spacing="2" fill="#F59E0B">ARCHIVE · 存档 · 非自研</text>
    <text x="56" y="146" font-size="62" font-weight="700" fill="#F9FAFB">dsh-purge</text>
    <text x="56" y="192" font-size="26" fill="#E5E7EB">上游 YuJunZhiXue/dsh-purge 的归档副本。</text>
    <text x="56" y="228" font-size="21" fill="#9CA3AF">DeepSeek Harness 红队评测插件，版本 1.1.71。</text>
    <line x1="56" y1="256" x2="600" y2="256" stroke="#374151" stroke-width="2"/>
    <text x="56" y="290" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="18" fill="#9CA3AF">Node.js ≥ 18 · dsh 0.2 · 默认分支 master</text>
    <text x="56" y="324" font-size="18" fill="#E5E7EB">作者与商业许可归上游所有；新版本只走上游频道</text>
  </g>

  <!-- Archive box + stamp -->
  <g>
    <rect x="800" y="80" width="280" height="200" rx="14" fill="#374151" stroke="#4B5563" stroke-width="2"/>
    <rect x="800" y="80" width="280" height="44" rx="14" fill="#4B5563"/>
    <rect x="800" y="108" width="280" height="16" fill="#4B5563"/>
    <line x1="800" y1="170" x2="1080" y2="170" stroke="#4B5563" stroke-width="2"/>
    <text x="836" y="216" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" fill="#F9FAFB">v1.1.71 · master</text>
    <text x="836" y="252" font-size="18" fill="#D1D5DB">上游 2026-10-27 起闭源</text>
    <g transform="rotate(-8 940 140)">
      <rect x="830" y="112" width="220" height="56" rx="6" fill="none" stroke="#F59E0B" stroke-width="4"/>
      <text x="940" y="150" font-size="30" font-weight="700" fill="#F59E0B" text-anchor="middle"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace">ARCHIVE</text>
    </g>
  </g>
</svg>
